# qwen-3-4b-guru-v5 — retrain to ship the backfill v4 deferred.
#
# Recipe is v4 (configs/qwen-3-4b-guru-v4.yml) VERBATIM. v5 is a data change only:
#
#   - Upstream backfill applied (guru PR #127): a 27B sample-pass tagged older
#     traditions with the 12 genuinely-cross-tradition drift concepts v4 had 0
#     training rows for (trinity, stellar_determinism, divine_immanence, initiation,
#     divination, esoteric_lineage, exorcism, gender, spirit_conjuration, incarnation,
#     qliphoth, talisman_magic). Node-4 gate PASS: all 12 now carry older-tradition
#     EXPRESSES rows (the v4 bellwether incarnation×Gita, 27B=3/v4=0, now 19 rows).
#
#   - Export is APPLIED TAGS ONLY (--status accepted), not v4's pending+accepted.
#     Train on owner-gated truth, not any label a model threw at a chunk. Viable now
#     because the corpus is heavily reviewed (accepted 36,626 >> pending 13,743).
#     extract.iter_teacher_chunks now DEDUPS one tag per (chunk,concept) — the
#     backfill's full-taxonomy re-tag would otherwise emit duplicate concept_id keys
#     (accepted-only already has 0 collisions; dedup is the defensive guarantee).
#     Export data/exports/2026-09-06T12-21-28Z: 4,440 ex / 25,402 tags / 0 dup keys.
#     Taxonomy unchanged at 154 leaf concepts (prompt v1). See
#     docs/qwen-3-4b-guru-v5-plan.md.
#
#   - Hyperparameters identical to v4 incl. max_seq_length 16384. v4 smoke-tested
#     16384 on the 3090 at 18.2GB peak (longest examples, FA2 active) with a LARGER,
#     longer dataset (max seq 15,399); v5's accepted-only export is a subset, so the
#     fit holds. Fallbacks if OOM: max_seq_length 15360 / 14336, or lora_r 16.

base_model: unsloth/Qwen3-4B-Instruct-2507-bnb-4bit
chat_template: qwen3-instruct
max_seq_length: 16384

lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

batch_size: 1
grad_accum: 16
epochs: 3
learning_rate: 1.5e-4
warmup_ratio: 0.03
lr_scheduler: cosine
optim: paged_adamw_8bit

logging_steps: 10
eval_steps: 100
save_steps: 100
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
packing: false
report_to: none
seed: 42

# Publish target (tag scheme qwen-3-4b-guru-v5; separate from v1-v4).
publish:
  hf_repo: 4rc4n4/qwen-3-4b-guru
  model_card: docs/qwen-3-4b-guru-card.md
  artifacts: ["adapter/**", "merged/**", "gguf/**", "README.md", "taxonomy.toml"]
