# qwen-3-4b-guru-v4 — retrain on the current corpus + full 154-concept taxonomy.
#
# Goal: teach the 44 concepts added since v3 so the 4B can BACKFILL older works
# tagged before those concepts existed (the taxonomy-drift problem). Same recipe
# as v3 (configs/qwen-3-4b-guru-v3.yml); the v4 deltas are data + context length:
#
#   - taxonomy 110 -> 154 leaf concepts. Clean superset: 0 removed/renamed, still
#     prompt_version v1. The +44 cluster into three seams matching the new corpus:
#     Sethian/Gnostic (barbelo, luminaries, self_begotten, incorruptible_generation,
#     stellar_determinism, rejection_of_sacrifice, qliphoth), Kybalion Hermetic
#     principles (mentalism, vibration, polarity, rhythm, gender), and
#     Western-esoteric psychism (psychic_attack, thought_form, etheric_projection,
#     haunting, possession, exorcism, aura, ... — Dion Fortune / Blavatsky / Lévi).
#
#   - Export is now a DENYLIST, not a teacher allowlist. staged_tags.model is
#     unreliable free-text (tag_concepts.py --model default, not the loaded gguf —
#     the new corpus carries both Qwen3.5 and Qwen3.8 labels for what may be one
#     physical teacher), so the export takes every tag EXCEPT the student lineage
#     (exclude_model_prefixes = qwen-3-4b-guru — never self-distill) and Carnice-9b
#     (86 chunks, all already 27B-covered, 0 unique). Contributing signatures land
#     in the export manifest as real provenance. 4,554 chunk-examples / 35,040 rows
#     (v3 was 3,504 / ~30k).
#
#   - max_seq_length raised 9472 -> 16384. The 154-concept definitions block is
#     11,439 tokens (v3's 110-concept block was 6,128) — the new concepts carry
#     long "distinct from X" disambiguation clauses. Measured total sequence
#     (real Qwen tokenizer, input+completion) over the eligible chunks:
#     p50 12,618, p90 13,367, p99 14,534, max 15,399. 16384 covers the max with
#     headroom and drops zero examples (v3's discipline). VRAM FALLBACKS if 16K
#     won't hold on the 24GB 3090: 15,360 truncates 0.2%, 14,336 truncates 1.4%;
#     or lora_r 16. SMOKE-TEST at 16384 across the length range before the full
#     run, exactly as v3 smoke-tested 8192/9472.

base_model: unsloth/Qwen3-4B-Instruct-2507-bnb-4bit
chat_template: qwen3-instruct
max_seq_length: 16384

lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

batch_size: 1
grad_accum: 16
epochs: 3
learning_rate: 1.5e-4
warmup_ratio: 0.03
lr_scheduler: cosine
optim: paged_adamw_8bit

logging_steps: 10
eval_steps: 100
save_steps: 100
save_total_limit: 3
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
packing: false
report_to: none
seed: 42

# Publish target (separate from v1/v2/v3; tag scheme qwen-3-4b-guru-v4).
publish:
  hf_repo: 4rc4n4/qwen-3-4b-guru
  model_card: docs/qwen-3-4b-guru-card.md
  artifacts: ["adapter/**", "merged/**", "gguf/**", "README.md", "taxonomy.toml"]
