[project]
name = "rellm"
version = "0.1.0"
description = "Distillation pipeline for the guru chunk→concept tagger."
requires-python = ">=3.11,<3.13"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
eval = [
    "ollama>=0.3",
]
# Training stack is intentionally NOT listed here — Unsloth has its own
# CUDA-matched installer. See train/train_distill.py for the install command.

[project.scripts]
rellm = "rellm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rellm"]
