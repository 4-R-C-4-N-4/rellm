# rellm — distillation pipeline config.

[guru]
# Paths to the upstream guru project that produces the source data.
repo       = "/home/ivy/Work/guru"
db         = "/home/ivy/Work/guru/data/guru.db"
corpus_dir = "/home/ivy/Work/guru/corpus"
taxonomy   = "/home/ivy/Work/guru/concepts/taxonomy.toml"

[rellm]
# Where this project lands snapshots, exports, and training artifacts.
# Paths are resolved relative to the directory containing this file.
data_dir  = "data"
snapshots = "data/snapshots"
exports   = "data/exports"

[model]
# Pipeline-level default only — the actual training base is set per-run in the
# YAML config's `base_model` (train_distill.py reads that, not this). The guru
# line trains on Qwen3-4B-Instruct-2507 (smaller than the old 7B, chosen for
# parallel-tagging throughput). Kept here for reference/back-compat.
base    = "unsloth/Qwen3-4B-Instruct-2507-bnb-4bit"

# The EXPORT does not allowlist teacher signatures — staged_tags.model is
# unreliable free-text (tag_concepts.py --model default, not the loaded gguf), so
# an allowlist would silently drop a mislabeled teacher run. Instead the export
# takes every tag EXCEPT the excluded ones below. The one invariant that matters:
# never distill on the student's own lineage (self-reinforcing error).

# Student lineage — the finetune's own tags. NEVER train on these.
exclude_model_prefixes = ["qwen-3-4b-guru"]
# Specific weak/experimental teachers to drop. Carnice-9b: 86 chunks, all
# already 27B-covered (0 unique) — excluding keeps 27B-only targets.
exclude_models = ["Carnice-9b"]

[prompt]
# staged_tags prompt_version filter. Bump when the upstream prompt changes
# meaningfully so old + new outputs aren't mixed in training.
version = "v1"
